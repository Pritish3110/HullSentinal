# Scenario 3: Structural Obstacles on Hull Plate
sim_engine_node:
  ros__parameters:
    scenario_name: "obstacles"
    num_cleaners: 1
    sensor_noise_std: 0.05
    cleaning_failure_rate: 0.0
    current_disturbance_x: 0.0
    current_disturbance_y: 0.0
    cleaning_rate: 0.40
    tool_radius: 0.40
    detection_radius: 1.50

safety_barrier:
  ros__parameters:
    safety_radius: 0.70

crawler_controller:
  ros__parameters:
    max_linear_speed: 0.40
