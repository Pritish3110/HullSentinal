# =============================================================================
# HullSentinal V2 — Centralized Master Configuration
# Single Source of Truth for World, Robots, Cognition, Safety, & Visualization
# =============================================================================

world:
  hull_width: 24.0          # Hull manifold length (meters)
  hull_height: 8.0          # Hull manifold height (meters)
  safety_margin: 0.8        # Hard boundary safety inset (meters)
  num_lanes: 3              # Number of horizontal coverage lanes
  lane_margin: 1.0          # Top/bottom margin for lane boundary
  lane_spacing: 2.0         # Vertical spacing between lane centerlines
  lane_width: 1.8           # Effective lane swath width (meters)

robots:
  mapper_1:
    role: "mapper"
    start_x: 1.5
    start_y: 2.0
    start_yaw: 0.0
    radius: 0.45
    max_linear_speed: 1.20
    max_angular_speed: 1.50
    sensor_fov_radius: 1.80
    sensor_range: 2.20
  cleaner_1:
    role: "cleaner"
    start_x: 1.5
    start_y: 7.0
    start_yaw: 0.0
    radius: 0.45
    max_linear_speed: 1.40
    max_angular_speed: 1.50
    tool_radius: 0.45
    cleaning_rate: 1.50
    clean_duration: 1.00

safety:
  safe_distance: 1.50       # Distance for NORMAL status (meters)
  warning_distance: 1.00    # Distance to trigger WARNING slowing (meters)
  critical_distance: 0.60   # Distance to trigger AVOIDANCE / emergency halt (meters)
  deadlock_timeout_sec: 2.5 # Timeout before cleaner initiates sidestep

risk:
  threshold_normal: 0.50    # Severity < 0.50 -> NORMAL
  threshold_medium: 0.70    # Severity < 0.70 -> MEDIUM
  threshold_high: 0.85      # Severity < 0.85 -> HIGH
  threshold_critical: 0.85  # Severity >= 0.85 -> CRITICAL (Emergency Trigger)

planner:
  grid_resolution: 0.20           # Occupancy grid cell size (meters)
  obstacle_inflation_radius: 0.55 # Static obstacle buffer (meters)
  dynamic_inflation_radius: 0.75  # Moving robot buffer (meters)

utility:
  w1_severity_risk: 1.00
  w2_path_cost: 0.08
  w3_age_bonus: 0.05
  requeue_bonus: 0.20
  emergency_override_bonus: 10.0
  risk_weights:
    crack: 1.00
    rust: 0.70
    biofouling: 0.40

visualization:
  rviz_update_rate: 10.0
  label_z_offset: 0.45
  label_stagger_dist: 1.50
  fixed_frame: "hull_world"

# Deterministic static obstacles (maintenance panels, sea chests, anodes)
# Coordinates (center_x, center_y, width, height)
static_obstacles:
  - id: "obs_hatch_01"
    name: "Maintenance Hatch Alpha"
    x: 7.5
    y: 2.8
    width: 1.2
    height: 0.6
  - id: "obs_panel_02"
    name: "Equipment Panel Bravo"
    x: 14.0
    y: 1.4
    width: 1.0
    height: 0.5
  - id: "obs_anode_03"
    name: "Sacrificial Anode Array"
    x: 6.0
    y: 4.8
    width: 1.0
    height: 0.5
  - id: "obs_seachest_04"
    name: "Sea Chest Intake Grate"
    x: 17.5
